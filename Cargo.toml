[package]
name = "skout"
version = "0.34.1"
edition = "2024"

[[bin]]
name = "skout"
path = "src/main.rs"

[dependencies]
clap = "=4.5.47"
dirs = "=6.0.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
